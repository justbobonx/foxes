<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>foxes</title>
    <link rel="stylesheet" href="css/style.css?v=1.2.1" />
  </head>
  <body>
    <canvas id="board"></canvas>

    <div id="hud">
      <div class="hud-left"><span id="os-count">0/6</span></div>
      <div class="hud-mid"><span id="score-level">0%</span></div>
      <div class="hud-right"><span id="score-stars">★ 0</span></div>
    </div>

    <div id="hud-bottom">
      <div class="hud-left">
        <button id="btn-menu" type="button">MENU</button>
      </div>
      <div class="hud-right">
        <button id="btn-check" type="button">CHECK</button>
      </div>
    </div>

    <div id="start-screen" class="overlay">
      <div class="start-panel">
        <div class="title-row">
          <img class="title-fox" src="images/fox.png" width="64" height="64" alt="" />
          <h1>
            foxes
            <span class="title-sub">in my fields</span>
          </h1>
          <img class="title-fox" src="images/fox.png" width="64" height="64" alt="" />
        </div>
        <button id="btn-start" type="button">Start</button>        
      </div>
      <a id="startEmail" href="https://x.com/just_bob" target="_blank" rel="noopener noreferrer">just_bob@X.com</a>
    </div>

    <div id="menu-screen" class="overlay" hidden>
      <div class="panel menu-panel">
        <button id="btn-clear" type="button">CLEAN UP</button>
        <button id="btn-reset" type="button">RESET</button>
        <button id="btn-give-up" type="button">GIVE UP</button>
      </div>
    </div>

    <div id="plan-screen" class="overlay" hidden>
      <div id="plan-row" class="plan-row"></div>
      <button id="btn-plan-back" type="button">BACK</button>
    </div>

    <div id="win-screen" class="overlay" hidden>
      <div class="panel win-panel">
        <h1>FOXES FOUND!</h1>
        <div class="win-stats">
          <div class="win-stat">
            <span class="win-lbl">SCORE</span>
            <strong id="win-score">100%</strong>
          </div>
          <div class="win-stat">
            <span class="win-lbl">TIME</span>
            <strong id="win-time">0:00</strong>
          </div>
          <div class="win-stat">
            <span class="win-lbl">HINTS</span>
            <strong id="win-hints" class="bad">0</strong>
          </div>
        </div>
        <button id="btn-win-new" type="button">OK</button>
      </div>
    </div>

    <script src="js/sprite.js?v=1.2.1"></script>
    <script src="js/cell.js?v=1.2.1"></script>
    <script src="js/grid.js?v=1.2.1"></script>
    <script src="js/solver.js?v=1.2.1"></script>
    <script src="js/grid_builder.js?v=1.2.1"></script>
    <script src="js/save.js?v=1.2.1"></script>
    <script src="js/forest.js?v=1.2.1"></script>
    <script src="js/planner.js?v=1.2.1"></script>
    <script src="js/hint.js?v=1.2.1"></script>
    <script src="js/chrome.js?v=1.2.1"></script>
    <script src="js/ui.js?v=1.2.1"></script>
    <script src="js/game.js?v=1.2.1"></script>
  </body>
</html>
